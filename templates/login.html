<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso ao Sistema - Hotel Elfsong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
<body class="d-flex flex-column min-vh-100 bg-light">
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="index.html">Hotel Elfsong</a>
                <div class="collapse navbar-collapse">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item"><a class="nav-link" href="index.html">Início & Quartos</a></li>
                        <li class="nav-item"><a class="nav-link" href="reservas.html">Realize sua Reserva</a></li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item"><a class="nav-link active btn btn-outline-light btn-sm px-3" href="login.html">Login</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container mt-5 pt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h3 class="card-title text-center mb-4 fw-bold">Login do Cliente</h3>
                        
                        <form id="form-login-cliente">
                            <div class="mb-3">
                                <label for="email" class="form-label">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="nome@exemplo.com" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Senha</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Entrar</button>
                        </form>

                        <div id="alerta-erro-cliente" class="alert alert-danger d-none small p-2 text-center">
                                email ou senha incorretos.
                        </div>
                        <div class="mt-4 pt-3 border-top text-center">
                            <small class="text-muted">
                                <a href="login_colaborador.html" class="text-decoration-none text-secondary">Acesso restrito a colaboradores &rarr;</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        </main>
    //chama script para processar login do cliente
    <script src="../js/login_cliente.js"></script>
</body>
</html>
