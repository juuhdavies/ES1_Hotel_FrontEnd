<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Reservas - Hotel Elfsong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
<body class="bg-light">
    <nav class="navbar navbar-expand-md navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">Hotel Elfsong</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Início & Quartos</a></li>
                    <li class="nav-item"><a class="nav-link active" href="reservas.html">Realize sua Reserva</a></li>
                    <li class="nav-item"><a class="nav-link active" href="painel_cliente.html">Minhas Reservas</a></li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link btn btn-outline-light btn-sm px-3" href="login.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>
     <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="fw-bold mb-4">Nova Reserva de Hospedagem</h2>
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <form id="form-reserva">
                            <div class="mb-3">
                                <label class="form-label">Nome Completo do Hóspede</label>
                                <input type="text" id="nome_cliente" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Categoria do Quarto</label>
                                <select id="tipo_quarto" class="form-select" required>
                                    <option value="" disabled selected>Carregando categorias...</option>
                                    <!-- JS aqui p/ chamar os tipos de quarto armazenados no BD-->
                                </select>
                            </div>
                            <div class="row g-3 mb-3">
                                <div class="col-md-6">
                                    <label class="form-label">Check-in</label>
                                    <input type="date" id="data_in" class="form-control" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Check-out</label>
                                    <input type="date" id="data_out" class="form-control" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label">Adultos</label>
                                    <input type="number" id="adultos" class="form-control" value="1" min="1" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label">Crianças</label>
                                    <input type="number" id="criancas" class="form-control" value="0" min="0" required>
                                </div>
                                <div class="col-md-4 d-flex align-items-end">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" id="com_cafe" checked>
                                        <label class="form-check-label">Incluir Café da Manhã</label>
                                    </div>
                                </div>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 py-2">Confirmar e Reservar</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/reservas.js"></script>

</body>
</html>
