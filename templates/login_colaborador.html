<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso Interno - Hotel Elfsong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head> 
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-dark">Hotel Elfsong</h2>
                    <p class="text-muted">Área de Operações e Gerência</p>
                </div>
                <div class="card shadow border-0 border-top border-4 border-primary">
                    <div class="card-body p-4">
                        <h4 class="card-title text-center mb-4 fw-bold text-primary">Painel do Colaborador</h4>
                        
                        <form id="form-login-colaborador">
                            <div class="mb-3">
                                <label class="form-label">ID de Funcionário</label>
                                <input type="text" id="id" class="form-control" placeholder="Ex: ID-123" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">Senha</label>
                                <input type="password" id="senha" class="form-control" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 fw-bold">Acessar Sistema Interno</button>
                        </form>
                        <div id="alerta-erro-colab" class="alert alert-danger d-none small p-2 text-center">
                                id ou senha incorretos.
                        </div>
                        <div class="mt-4 pt-3 border-top text-center">
                            <small>
                                <a href="login.html" class="text-decoration-none text-secondary">&larr; Voltar para Login do Cliente</a>
                            </small>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/login_colaborador.js"></script>
</body>
</html>
